<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokémon Sleep 寶可夢機率與食材資料庫</title>
  <meta name="description" content="Pokémon Sleep 寶可夢機率與食材線上資料庫，支援即時搜尋、屬性得意篩選、食材產量與幫忙間隔比對。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Header -->
  <header>
    <div class="header-container">
      <div class="brand">
        <div class="brand-logo">⚡</div>
        <div>
          <h1 class="brand-title">Pokémon Sleep 資料庫</h1>
          <div class="brand-subtitle">機率、食材與屬性完整線上檢索</div>
        </div>
      </div>
      <nav class="nav-tabs">
        <a href="index.html" class="nav-tab active">⚡ 寶可夢圖鑑</a>
        <a href="recipes.html" class="nav-tab">🍲 料理食譜大全</a>
      </nav>
      <div class="header-actions">
        <div class="view-mode-toggle">
          <button id="toggle-grid" class="toggle-btn">🎴 卡片</button>
          <button id="toggle-table" class="toggle-btn active">📊 表格</button>
        </div>
        <div class="sync-wrapper">
          <button id="sync-btn" class="sync-btn">🔄 同步資料</button>
          <div id="sync-status" class="sync-status"></div>
        </div>
      </div>
    </div>
  </header>

  <main>
    <!-- Controls -->
    <section class="controls-container" aria-label="Search and Filter Controls">
      <div class="search-filter-row">
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" id="search-input" class="search-input"
            placeholder="搜尋寶可夢名稱 (中/英/日) 或 No. 編號..."
            aria-label="搜尋寶可夢">
        </div>
      </div>
      <div class="filter-tags-group">
        <span class="filter-label">屬性：</span>
        <div id="type-filter-tags" style="display:flex;flex-wrap:wrap;gap:6px;"></div>
      </div>
      <div class="filter-tags-group">
        <span class="filter-label">得意：</span>
        <div id="specialty-filter-tags" style="display:flex;flex-wrap:wrap;gap:6px;"></div>
      </div>
    </section>

    <!-- Stats Bar -->
    <div class="stats-bar">
      <span id="count-badge">載入中...</span>
      <div style="display:flex;gap:12px;align-items:center;">
        <a href="https://docs.google.com/spreadsheets/d/1JkV2QxGGFDBzUfDxfOhTD3hrJJzu9qCS4A6c_HicIDc/edit#gid=87785598"
           target="_blank" style="color:var(--accent-color);text-decoration:none;font-size:12px;">📊 參考資料來源</a>
        <a href="https://docs.google.com/spreadsheets/d/1BD05wG8Gy3EUNzhg5mtErllr-Rkv20iFGsZ8kNsuUJ0/edit"
           target="_blank" style="color:var(--accent-color);text-decoration:none;font-size:12px;">📋 目標試算表</a>
      </div>
    </div>

    <!-- Content Area -->
    <section id="content-area">
      <div style="text-align:center;padding:60px;color:var(--text-muted);">
        資料載入中，請稍候...
      </div>
    </section>
  </main>

  <footer>
    <p>
      Pokémon Sleep 寶可夢資料庫 &copy; 2026 ·
      <a href="https://github.com/s102213039/pokemon-sleep-app" target="_blank">GitHub 原始碼</a> ·
      Powered by <a href="https://www.serebii.net/" target="_blank">Serebii.net</a>
    </p>
    <p style="margin-top:8px;color:var(--text-muted);font-size:11px;">
      同步功能需搭配本地同步伺服器：<code style="background:rgba(255,255,255,0.08);padding:2px 6px;border-radius:4px;">python sync_server.py</code>
    </p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
