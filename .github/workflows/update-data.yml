name: Pokemon Sleep Data & News Sync

on:
  # 手動觸發（按鈕點擊從網站 dispatch）
  workflow_dispatch:
    inputs:
      sync_type:
        description: '同步類型'
        required: true
        default: 'full'
        type: choice
        options:
          - full          # 全部同步（寶可夢 + 食譜 + 新聞）
          - news_only     # 僅同步最新官方新聞公告
          - pokemon_only  # 只同步寶可夢資料
          - recipes_only  # 只同步食譜資料

  # 每日自動同步官方新聞與資料 (03:00 UTC / 台灣 11:00)
  schedule:
    - cron: '0 3 * * *'

jobs:
  sync-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml

      - name: Check sync type
        run: |
          echo "Sync type: ${{ github.event.inputs.sync_type || 'full' }}"

      - name: Execute data sync
        env:
          SYNC_TYPE: ${{ github.event.inputs.sync_type || 'full' }}
        run: |
          if [ "${{ github.event.inputs.sync_type }}" != "news_only" ]; then
            python scripts/sync_data.py
          fi
          python scripts/build_news.py

      - name: Verify data integrity
        run: |
          python - <<'EOF'
          import json, sys
          for fn in ['data/data.json', 'data/recipes.json', 'data/news.json']:
              try:
                  with open(fn, 'r', encoding='utf-8') as f:
                      d = json.load(f)
                  print(f"Verified {fn}: {len(d)} items")
              except Exception as e:
                  print(f"Warning {fn}: {e}")
          EOF

      - name: Git commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/data.json data/recipes.json data/news.json
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "Auto-sync: Update Pokemon Sleep data & news [$(date '+%Y-%m-%d %H:%M')]"
            git push
            echo "Pushed latest data and news to GitHub Pages"
          fi
